schema_version: "1.1"
name: docs-detailed-design
tags: [docs]
plugins: ["../../../../plugins/core", "../../../../plugins/docs"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "/docs:detailed-design export"
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: "~ は Read のパスにそのまま書けます。ホームの絶対パスを推測しないでください。"
graders:
  - { name: reads-template, type: tool_used, tool: Read, input_match: "docs-templates/detailed-design\\.md" }
  - { name: creates-file, type: file_exists, path: "docs/detailed-design/export.md" }
  - { name: has-dd-id, type: regex, pattern: "DD-\\d+", target: { source: file, path: "docs/detailed-design/export.md" } }
  - { name: links-basic-design, type: regex, pattern: "BD-002", target: { source: file, path: "docs/detailed-design/export.md" } }
