schema_version: "1.1"
name: docs-requirements
tags: [docs]
plugins: ["../../../../plugins/core", "../../../../plugins/docs"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "/docs:requirements 支出を月ごとに集計して表示したい"
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: "~ は Read のパスにそのまま書けます。ホームの絶対パスを推測しないでください。"
graders:
  - { name: reads-template, type: tool_used, tool: Read, input_match: "docs-templates/requirements\\.md" }
  - { name: no-edit-before-answers, type: tool_used, tool: Edit, min: 0, max: 0 }
  - { name: no-write-before-answers, type: tool_used, tool: Write, min: 0, max: 0 }
  - { name: asks-questions, type: regex, pattern: "[？?]|ですか|ますか|教えてください", target: last_message }
