schema_version: "1.1"
name: svelte-hook
tags: [knowledge-read]
plugins: ["../../../../plugins/foundation"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "src/lib/Counter.svelte に、ボタンを押すと数が増えるカウンターを実装してください。"
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: read-knowledge
    type: tool_used
    tool: Read
    input_match: "knowledge/(INDEX\\.md|svelte/)"
