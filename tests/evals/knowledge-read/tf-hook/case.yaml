schema_version: "1.1"
name: tf-hook
tags: [knowledge-read]
plugins: ["../../../../plugins/core", "../../../../plugins/infra-terraform"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "infra/main.tf に、ログを保存するストレージのバケットを1つ追加してください。"
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: read-knowledge
    type: tool_used
    tool: Read
    input_match: "knowledge/(INDEX\\.md|terraform/)"
